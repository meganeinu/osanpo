<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おさんぽルートメーカー</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #23251f; --sub: #6b6e63;
    --accent: #2f7d5b; --accent-ink: #ffffff; --line: #dcdcd3; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; color: var(--ink); }
  #panel { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
    display: grid; gap: 10px; }
  label.small { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; }
  #searchBox gmp-place-autocomplete { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; width: 100%; }
  .primary:disabled { opacity: .5; }
  .secondary { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; color: var(--ink); text-decoration: none; text-align: center; }
  #startLabel { font-size: 13px; color: var(--sub); }
  #map { flex: 1; min-height: 280px; }
  #result { padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); display: none; gap: 8px; }
  #result.show { display: grid; }
  #result .stats { font-size: 15px; }
  #msg { padding: 8px 16px; font-size: 13px; display: none; }
  #msg.show { display: block; }
  #msg.err { background: #fbe9e7; color: var(--err); }
  #msg.info { background: #e8f3ed; color: var(--accent); }
  /* キー入力画面 */
  #setup { position: fixed; inset: 0; background: var(--bg); display: none; padding: 24px 20px;
    overflow: auto; z-index: 10; }
  #setup.show { display: block; }
  #setup .box { max-width: 480px; margin: 0 auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  #setup h2 { margin: 0; font-size: 18px; }
  #setup p, #setup li { font-size: 14px; line-height: 1.6; color: var(--sub); margin: 0; }
  #setup ol { margin: 0; padding-left: 20px; }
  #keyInput { width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
</style>
</head>
<body>

<div id="setup">
  <div class="box">
    <h2>Google Maps APIキーを入力</h2>
    <p>Google Cloud Consoleで次の3つを有効にしたキーを使ってください。</p>
    <ol>
      <li>Maps JavaScript API</li>
      <li>Places API (New)</li>
      <li>Routes API</li>
    </ol>
    <input id="keyInput" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false">
    <label class="check"><input id="rememberKey" type="checkbox" checked> このブラウザに保存する</label>
    <button id="saveKey" class="primary">はじめる</button>
    <button id="clearKey" class="secondary" type="button">保存したキーを削除</button>
    <p id="setupErr" style="color:var(--err)"></p>
  </div>
</div>

<header>
  <h1>おさんぽルートメーカー</h1>
  <button id="openSetup" class="icon-btn" type="button">APIキー</button>
</header>

<div id="panel">
  <div>
    <label class="small">スタート地点</label>
    <div id="searchBox"></div>
    <div class="row" style="margin-top:8px">
      <button id="useHere" class="chip" type="button">現在地を使う</button>
      <span id="startLabel">地図をタップしても指定できます</span>
    </div>
  </div>
  <div>
    <label class="small">歩く距離</label>
    <div class="row" id="distRow">
      <button class="chip" data-km="1" type="button">1km</button>
      <button class="chip" data-km="2" aria-pressed="true" type="button">2km</button>
      <button class="chip" data-km="3" type="button">3km</button>
      <button class="chip" data-km="5" type="button">5km</button>
    </div>
  </div>
  <button id="makeRoute" class="primary" disabled>おまかせでルートを作る</button>
</div>

<div id="msg"></div>
<div id="map"></div>

<div id="result">
  <div class="stats" id="stats"></div>
  <div class="row">
    <button id="reroll" class="secondary" type="button" style="flex:1">別のルート</button>
    <a id="openGmaps" class="secondary" target="_blank" rel="noopener" style="flex:1">Googleマップで開く</a>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = "osanpo_maps_api_key";
  const $ = (id) => document.getElementById(id);

  // ---------- 画面にエラーを出す（コンソールを見なくて済むように） ----------
  function showMsg(text, type = "err") {
    const el = $("msg");
    el.textContent = text;
    el.className = "show " + type;
  }
  function hideMsg() { $("msg").className = ""; }
  window.addEventListener("error", (e) => showMsg("エラー: " + e.message));
  window.addEventListener("unhandledrejection", (e) => showMsg("エラー: " + (e.reason?.message || e.reason)));

  // ---------- APIキーの保存（localStorageが使えない環境でも落ちない） ----------
  const store = {
    get() { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } },
    set(v) { try { localStorage.setItem(STORAGE_KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(STORAGE_KEY); } catch {} },
  };

  let apiKey = null;
  let mapsLoaded = false;

  function openSetup(errText = "") {
    $("keyInput").value = apiKey || store.get() || "";
    $("setupErr").textContent = errText;
    $("setup").classList.add("show");
  }
  $("openSetup").onclick = () => openSetup();
  $("clearKey").onclick = () => { store.clear(); $("keyInput").value = ""; $("setupErr").textContent = "削除しました"; };
  $("saveKey").onclick = () => {
    const k = $("keyInput").value.trim();
    if (!k) { $("setupErr").textContent = "キーを入力してください"; return; }
    if ($("rememberKey").checked) store.set(k); else store.clear();
    if (mapsLoaded && k !== apiKey) {
      // Maps JSは1ページで1回しか読み込めないので、キー変更時は再読み込み
      location.reload();
      return;
    }
    apiKey = k;
    $("setup").classList.remove("show");
    loadMaps(k);
  };

  // キーが間違っているとGoogleがこれを呼ぶ
  window.gm_authFailure = () => {
    store.clear();
    openSetup("APIキーが使えませんでした。キーと、有効にしたAPIを確認してください。");
  };

  // ---------- Maps JSの読み込み（キーが決まってから1回だけ） ----------
  function loadMaps(key) {
    if (mapsLoaded) return;
    mapsLoaded = true;
    window.__initOsanpo = () => init().catch((e) => showMsg("初期化に失敗: " + e.message));
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
      "&v=weekly&loading=async&language=ja&region=JP&callback=__initOsanpo";
    s.async = true;
    s.onerror = () => showMsg("Google Mapsを読み込めませんでした。通信環境を確認してください。");
    document.head.appendChild(s);
  }

  // ---------- 本体 ----------
  let map, startMarker, routeLine, wpMarkers = [];
  let start = null;          // {lat, lng}
  let targetKm = 2;
  let lastWaypoints = [];

  async function init() {
    const { Map } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
    const placesLib = await google.maps.importLibrary("places");
    await google.maps.importLibrary("geometry");

    map = new Map($("map"), {
      center: { lat: 35.681, lng: 139.767 }, zoom: 15,
      mapId: "DEMO_MAP_ID", disableDefaultUI: true, zoomControl: true,
      gestureHandling: "greedy",
    });

    startMarker = new AdvancedMarkerElement({ map: null, title: "スタート" });

    // 新しいPlaces APIの検索ボックス（旧Autocompleteは新規利用不可）
    const ac = new placesLib.PlaceAutocompleteElement({ includedRegionCodes: ["jp"] });
    ac.placeholder = "駅名・住所・施設名で検索";
    $("searchBox").appendChild(ac);

    const onPlace = async (place) => {
      await place.fetchFields({ fields: ["displayName", "location"] });
      if (!place.location) { showMsg("その場所の位置が取れませんでした"); return; }
      setStart({ lat: place.location.lat(), lng: place.location.lng() }, place.displayName);
    };
    ac.addEventListener("gmp-select", (e) => onPlace(e.placePrediction.toPlace()).catch(err => showMsg(err.message)));
    // 古いバージョンのイベント名にも対応
    ac.addEventListener("gmp-placeselect", (e) => e.place && onPlace(e.place).catch(err => showMsg(err.message)));

    map.addListener("click", (e) => setStart({ lat: e.latLng.lat(), lng: e.latLng.lng() }, "地図で指定した地点"));
    hideMsg();
  }

  function setStart(pos, label) {
    start = pos;
    startMarker.position = pos;
    startMarker.map = map;
    map.panTo(pos);
    $("startLabel").textContent = "スタート: " + (label || "指定地点");
    $("makeRoute").disabled = false;
    clearRoute();
  }

  $("useHere").onclick = () => {
    if (!map) { showMsg("先にAPIキーを入力してください"); return; }
    if (!navigator.geolocation) { showMsg("このブラウザでは現在地が使えません"); return; }
    showMsg("現在地を取得中…", "info");
    navigator.geolocation.getCurrentPosition(
      (p) => { hideMsg(); setStart({ lat: p.coords.latitude, lng: p.coords.longitude }, "現在地"); map.setZoom(15); },
      () => showMsg("現在地を取得できませんでした。検索か地図タップで指定してください。"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  document.querySelectorAll("#distRow .chip").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll("#distRow .chip").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      targetKm = Number(b.dataset.km);
    };
  });

  // ---------- ルートづくり ----------
  // スタートから少し離れた円周上に経由地を置いて、ぐるっと戻ってくる周回ルートを作る
  function makeWaypoints(origin, km, scale = 1) {
    const ROAD_FACTOR = 1.3;                        // 直線より道は長くなる分
    const r = (km * 1000 * scale) / (4 * Math.SQRT2 * ROAD_FACTOR); // 4点の正方形周回
    const bearing = Math.random() * 360;
    const g = google.maps.geometry.spherical;
    const o = new google.maps.LatLng(origin.lat, origin.lng);
    const center = g.computeOffset(o, r, bearing);
    const back = bearing + 180;                     // centerから見たスタートの方角
    const dir = Math.random() < 0.5 ? 1 : -1;       // 時計回り or 反時計回り
    return [1, 2, 3].map((i) => {
      const p = g.computeOffset(center, r, back + dir * 90 * i);
      return { lat: p.lat(), lng: p.lng() };
    });
  }

  async function computeRoute(origin, waypoints) {
    const ll = (p) => ({ location: { latLng: { latitude: p.lat, longitude: p.lng } } });
    const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": apiKey,
        "X-Goog-FieldMask": "routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline",
      },
      body: JSON.stringify({
        origin: ll(origin), destination: ll(origin),
        intermediates: waypoints.map(ll),
        travelMode: "WALK", languageCode: "ja-JP",
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = data?.error?.message || res.statusText;
      if (res.status === 403) throw new Error("Routes APIが使えません。Cloud ConsoleでRoutes APIを有効にしてください。（" + m + "）");
      throw new Error("ルート取得に失敗: " + m);
    }
    if (!data.routes?.length) throw new Error("歩けるルートが見つかりませんでした。別のルートを試してください。");
    return data.routes[0];
  }

  function clearRoute() {
    if (routeLine) routeLine.setMap(null);
    wpMarkers.forEach((m) => (m.map = null));
    wpMarkers = [];
    $("result").classList.remove("show");
  }

  async function makeRoute() {
    if (!start) return;
    const btn = $("makeRoute");
    btn.disabled = true; btn.textContent = "考え中…";
    showMsg("ルートを作っています…", "info");
    try {
      let wps = makeWaypoints(start, targetKm);
      let route = await computeRoute(start, wps);
      // 目標と25%以上ずれたら、大きさを補正して1回だけやり直す
      const ratio = route.distanceMeters / (targetKm * 1000);
      if (ratio < 0.75 || ratio > 1.25) {
        const wps2 = makeWaypoints(start, targetKm, 1 / ratio);
        const route2 = await computeRoute(start, wps2);
        if (Math.abs(route2.distanceMeters - targetKm * 1000) < Math.abs(route.distanceMeters - targetKm * 1000)) {
          wps = wps2; route = route2;
        }
      }
      drawRoute(route, wps);
      hideMsg();
    } catch (e) {
      showMsg(e.message);
    } finally {
      btn.disabled = false; btn.textContent = "おまかせでルートを作る";
    }
  }

  function drawRoute(route, wps) {
    clearRoute();
    const path = google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline);
    routeLine = new google.maps.Polyline({ path, map, strokeColor: "#2f7d5b", strokeWeight: 6, strokeOpacity: 0.85 });
    const bounds = new google.maps.LatLngBounds();
    path.forEach((p) => bounds.extend(p));
    map.fitBounds(bounds, 40);

    lastWaypoints = wps;
    const km = (route.distanceMeters / 1000).toFixed(1);
    const min = Math.round(parseInt(route.duration, 10) / 60);
    $("stats").textContent = `約 ${km} km ・ 徒歩 約 ${min} 分`;

    const fmt = (p) => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
    $("openGmaps").href = "https://www.google.com/maps/dir/?api=1&travelmode=walking" +
      "&origin=" + fmt(start) + "&destination=" + fmt(start) +
      "&waypoints=" + encodeURIComponent(wps.map(fmt).join("|"));
    $("result").classList.add("show");
  }

  $("makeRoute").onclick = makeRoute;
  $("reroll").onclick = makeRoute;

  // ---------- 起動 ----------
  const saved = store.get();
  if (saved) { apiKey = saved; loadMaps(saved); }
  else openSetup();
})();
</script>
</body>
</html>
