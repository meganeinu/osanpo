<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おさんぽルートメーカー</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #23251f; --sub: #6b6e63;
    --accent: #2f7d5b; --accent-ink: #ffffff; --line: #dcdcd3; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; color: var(--ink); }
  #panel { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
    display: grid; gap: 10px; }
  label.small { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; }
  #searchBox gmp-place-autocomplete { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; width: 100%; }
  .primary:disabled { opacity: .5; }
  .secondary { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; color: var(--ink); text-decoration: none; text-align: center; }
  .secondary:disabled { opacity: .4; }
  #startLabel { font-size: 13px; color: var(--sub); }
  #map { height: 46vh; min-height: 260px; }
  #result { padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); display: none; gap: 8px; }
  #result.show { display: grid; }
  #result .stats { font-size: 15px; }
  #msg { padding: 8px 16px; font-size: 13px; display: none; }
  #msg.show { display: block; }
  #msg.err { background: #fbe9e7; color: var(--err); }
  #msg.info { background: #e8f3ed; color: var(--accent); }

  /* お散歩日記 */
  #walk { display: none; padding: 12px 16px 24px; background: var(--card); border-top: 1px solid var(--line); gap: 10px; }
  #walk.show { display: grid; }
  #walkTitle { font-size: 16px; font-weight: 700; margin: 0; }
  #walkImg { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; background: #e9e8e2; display: block; }
  #walkText { font-size: 15px; line-height: 1.8; margin: 0; min-height: 3.6em; }
  #walkCount { font-size: 12px; color: var(--sub); }
  #walkSummary { font-size: 14px; line-height: 1.8; color: var(--sub); margin: 0; padding: 10px 12px;
    background: var(--bg); border-radius: 10px; display: none; }
  #walkSummary.show { display: block; }
  .walker { font-size: 26px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }

  /* 設定画面 */
  #setup { position: fixed; inset: 0; background: var(--bg); display: none; padding: 24px 20px;
    overflow: auto; z-index: 10; }
  #setup.show { display: block; }
  #setup .box { max-width: 480px; margin: 0 auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  #setup h2 { margin: 0; font-size: 18px; }
  #setup h3 { margin: 8px 0 0; font-size: 15px; }
  #setup p, #setup li { font-size: 14px; line-height: 1.6; color: var(--sub); margin: 0; }
  #setup ol { margin: 0; padding-left: 20px; }
  #setup input[type=text] { width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
</style>
</head>
<body>

<div id="setup">
  <div class="box">
    <h2>APIキーの設定</h2>

    <h3>Google Maps APIキー（必須）</h3>
    <p>Google Cloud Consoleで次の4つを有効にしたキーを使ってください。</p>
    <ol>
      <li>Maps JavaScript API</li>
      <li>Places API (New)</li>
      <li>Routes API</li>
      <li>Street View Static API（AIお散歩で使用）</li>
    </ol>
    <input id="keyInput" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false">

    <h3>Gemini APIキー（AIお散歩用）</h3>
    <p>Google AI Studio（aistudio.google.com）で無料で発行できます。</p>
    <input id="geminiInput" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false">
    <label class="small" for="modelInput">モデル名（よく分からなければそのままで大丈夫）</label>
    <input id="modelInput" type="text" placeholder="gemini-flash-latest" autocomplete="off" spellcheck="false">

    <label class="check"><input id="rememberKey" type="checkbox" checked> このブラウザに保存する</label>
    <button id="saveKey" class="primary">保存してはじめる</button>
    <button id="clearKey" class="secondary" type="button">保存したキーをすべて削除</button>
    <p id="setupErr" style="color:var(--err)"></p>
  </div>
</div>

<header>
  <h1>おさんぽルートメーカー</h1>
  <button id="openSetup" class="icon-btn" type="button">APIキー</button>
</header>

<div id="panel">
  <div>
    <label class="small">スタート地点</label>
    <div id="searchBox"></div>
    <div class="row" style="margin-top:8px">
      <button id="useHere" class="chip" type="button">現在地を使う</button>
      <span id="startLabel">地図をタップしても指定できます</span>
    </div>
  </div>
  <div>
    <label class="small">歩く距離</label>
    <div class="row" id="distRow">
      <button class="chip" data-km="1" type="button">1km</button>
      <button class="chip" data-km="2" aria-pressed="true" type="button">2km</button>
      <button class="chip" data-km="3" type="button">3km</button>
      <button class="chip" data-km="5" type="button">5km</button>
    </div>
  </div>
  <button id="makeRoute" class="primary" disabled>おまかせでルートを作る</button>
</div>

<div id="msg"></div>
<div id="map"></div>

<div id="result">
  <div class="stats" id="stats"></div>
  <div class="row">
    <button id="reroll" class="secondary" type="button" style="flex:1">別のルート</button>
    <a id="openGmaps" class="secondary" target="_blank" rel="noopener" style="flex:1">Googleマップで開く</a>
  </div>
  <button id="aiWalk" class="primary" type="button">AIにお散歩してもらう</button>
</div>

<section id="walk" aria-live="polite">
  <p id="walkTitle"></p>
  <img id="walkImg" alt="">
  <div id="walkCount"></div>
  <p id="walkText"></p>
  <div class="row">
    <button id="walkPrev" class="secondary" type="button" style="flex:1">◀ 前</button>
    <button id="walkPlay" class="secondary" type="button" style="flex:1">一時停止</button>
    <button id="walkNext" class="secondary" type="button" style="flex:1">次 ▶</button>
  </div>
  <p id="walkSummary"></p>
</section>

<script>
(() => {
  const K_MAPS = "osanpo_maps_api_key";
  const K_GEMINI = "osanpo_gemini_key";
  const K_MODEL = "osanpo_gemini_model";
  const DEFAULT_MODEL = "gemini-flash-latest";
  const $ = (id) => document.getElementById(id);

  // ---------- 画面にメッセージを出す ----------
  function showMsg(text, type = "err") {
    const el = $("msg");
    el.textContent = text;
    el.className = "show " + type;
  }
  function hideMsg() { $("msg").className = ""; }
  window.addEventListener("error", (e) => showMsg("エラー: " + e.message));
  window.addEventListener("unhandledrejection", (e) => showMsg("エラー: " + (e.reason?.message || e.reason)));

  // ---------- 保存（localStorageが使えない環境でも落ちない） ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let apiKey = null;
  let geminiKey = store.get(K_GEMINI) || "";
  let geminiModel = store.get(K_MODEL) || DEFAULT_MODEL;
  let mapsLoaded = false;

  function openSetup(errText = "") {
    $("keyInput").value = apiKey || store.get(K_MAPS) || "";
    $("geminiInput").value = geminiKey;
    $("modelInput").value = geminiModel === DEFAULT_MODEL ? "" : geminiModel;
    $("setupErr").textContent = errText;
    $("setup").classList.add("show");
  }
  $("openSetup").onclick = () => openSetup();
  $("clearKey").onclick = () => {
    [K_MAPS, K_GEMINI, K_MODEL].forEach(store.del);
    $("keyInput").value = ""; $("geminiInput").value = ""; $("modelInput").value = "";
    geminiKey = ""; geminiModel = DEFAULT_MODEL;
    $("setupErr").textContent = "削除しました";
  };
  $("saveKey").onclick = () => {
    const k = $("keyInput").value.trim();
    if (!k) { $("setupErr").textContent = "Google Maps APIキーを入力してください"; return; }
    geminiKey = $("geminiInput").value.trim();
    geminiModel = $("modelInput").value.trim() || DEFAULT_MODEL;
    if ($("rememberKey").checked) {
      store.set(K_MAPS, k);
      geminiKey ? store.set(K_GEMINI, geminiKey) : store.del(K_GEMINI);
      store.set(K_MODEL, geminiModel);
    } else {
      [K_MAPS, K_GEMINI, K_MODEL].forEach(store.del);
    }
    if (mapsLoaded && k !== apiKey) { location.reload(); return; } // Maps JSは1ページ1回しか読めない
    apiKey = k;
    $("setup").classList.remove("show");
    loadMaps(k);
  };

  window.gm_authFailure = () => {
    store.del(K_MAPS);
    openSetup("Google Maps APIキーが使えませんでした。キーと、有効にしたAPIを確認してください。");
  };

  function loadMaps(key) {
    if (mapsLoaded) return;
    mapsLoaded = true;
    window.__initOsanpo = () => init().catch((e) => showMsg("初期化に失敗: " + e.message));
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
      "&v=weekly&loading=async&language=ja&region=JP&callback=__initOsanpo";
    s.async = true;
    s.onerror = () => showMsg("Google Mapsを読み込めませんでした。通信環境を確認してください。");
    document.head.appendChild(s);
  }

  // ---------- 地図とルート ----------
  let map, startMarker, walkerMarker, routeLine, AdvMarker, svService;
  let start = null;
  let targetKm = 2;
  let routePath = [];   // google.maps.LatLng[]

  async function init() {
    const { Map } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
    const placesLib = await google.maps.importLibrary("places");
    const svLib = await google.maps.importLibrary("streetView");
    await google.maps.importLibrary("geometry");
    AdvMarker = AdvancedMarkerElement;
    svService = new svLib.StreetViewService();

    map = new Map($("map"), {
      center: { lat: 35.681, lng: 139.767 }, zoom: 15,
      mapId: "DEMO_MAP_ID", disableDefaultUI: true, zoomControl: true,
      gestureHandling: "greedy",
    });
    startMarker = new AdvancedMarkerElement({ map: null, title: "スタート" });
    const w = document.createElement("div");
    w.className = "walker"; w.textContent = "🚶";
    walkerMarker = new AdvancedMarkerElement({ map: null, content: w, title: "おさんぽ中" });

    const ac = new placesLib.PlaceAutocompleteElement({ includedRegionCodes: ["jp"] });
    ac.placeholder = "駅名・住所・施設名で検索";
    $("searchBox").appendChild(ac);
    const onPlace = async (place) => {
      await place.fetchFields({ fields: ["displayName", "location"] });
      if (!place.location) { showMsg("その場所の位置が取れませんでした"); return; }
      setStart({ lat: place.location.lat(), lng: place.location.lng() }, place.displayName);
    };
    ac.addEventListener("gmp-select", (e) => onPlace(e.placePrediction.toPlace()).catch(err => showMsg(err.message)));
    ac.addEventListener("gmp-placeselect", (e) => e.place && onPlace(e.place).catch(err => showMsg(err.message)));

    map.addListener("click", (e) => setStart({ lat: e.latLng.lat(), lng: e.latLng.lng() }, "地図で指定した地点"));
    hideMsg();
  }

  function setStart(pos, label) {
    start = pos;
    startMarker.position = pos;
    startMarker.map = map;
    map.panTo(pos);
    $("startLabel").textContent = "スタート: " + (label || "指定地点");
    $("makeRoute").disabled = false;
    clearRoute();
  }

  $("useHere").onclick = () => {
    if (!map) { showMsg("先にAPIキーを入力してください"); return; }
    if (!navigator.geolocation) { showMsg("このブラウザでは現在地が使えません"); return; }
    showMsg("現在地を取得中…", "info");
    navigator.geolocation.getCurrentPosition(
      (p) => { hideMsg(); setStart({ lat: p.coords.latitude, lng: p.coords.longitude }, "現在地"); map.setZoom(15); },
      () => showMsg("現在地を取得できませんでした。検索か地図タップで指定してください。"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  document.querySelectorAll("#distRow .chip").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll("#distRow .chip").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      targetKm = Number(b.dataset.km);
    };
  });

  function makeWaypoints(origin, km, scale = 1) {
    const ROAD_FACTOR = 1.3;
    const r = (km * 1000 * scale) / (4 * Math.SQRT2 * ROAD_FACTOR);
    const bearing = Math.random() * 360;
    const g = google.maps.geometry.spherical;
    const o = new google.maps.LatLng(origin.lat, origin.lng);
    const center = g.computeOffset(o, r, bearing);
    const back = bearing + 180;
    const dir = Math.random() < 0.5 ? 1 : -1;
    return [1, 2, 3].map((i) => {
      const p = g.computeOffset(center, r, back + dir * 90 * i);
      return { lat: p.lat(), lng: p.lng() };
    });
  }

  async function computeRoute(origin, waypoints) {
    const ll = (p) => ({ location: { latLng: { latitude: p.lat, longitude: p.lng } } });
    const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": apiKey,
        "X-Goog-FieldMask": "routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline",
      },
      body: JSON.stringify({
        origin: ll(origin), destination: ll(origin),
        intermediates: waypoints.map(ll),
        travelMode: "WALK", languageCode: "ja-JP",
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const m = data?.error?.message || res.statusText;
      if (res.status === 403) throw new Error("Routes APIが使えません。Cloud ConsoleでRoutes APIを有効にしてください。（" + m + "）");
      throw new Error("ルート取得に失敗: " + m);
    }
    if (!data.routes?.length) throw new Error("歩けるルートが見つかりませんでした。別のルートを試してください。");
    return data.routes[0];
  }

  function clearRoute() {
    if (routeLine) routeLine.setMap(null);
    routePath = [];
    $("result").classList.remove("show");
    stopWalk();
    if (cachedStops) {
      cachedStops.stops.forEach((s) => s.img && URL.revokeObjectURL(s.img.blobUrl));
      cachedStops = null;
    }
  }

  async function makeRoute() {
    if (!start) return;
    const btn = $("makeRoute");
    btn.disabled = true; btn.textContent = "考え中…";
    showMsg("ルートを作っています…", "info");
    try {
      let wps = makeWaypoints(start, targetKm);
      let route = await computeRoute(start, wps);
      const ratio = route.distanceMeters / (targetKm * 1000);
      if (ratio < 0.75 || ratio > 1.25) {
        const wps2 = makeWaypoints(start, targetKm, 1 / ratio);
        const route2 = await computeRoute(start, wps2);
        if (Math.abs(route2.distanceMeters - targetKm * 1000) < Math.abs(route.distanceMeters - targetKm * 1000)) {
          wps = wps2; route = route2;
        }
      }
      drawRoute(route, wps);
      hideMsg();
    } catch (e) {
      showMsg(e.message);
    } finally {
      btn.disabled = false; btn.textContent = "おまかせでルートを作る";
    }
  }

  function drawRoute(route, wps) {
    clearRoute();
    routePath = google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline);
    routeLine = new google.maps.Polyline({ path: routePath, map, strokeColor: "#2f7d5b", strokeWeight: 6, strokeOpacity: 0.85 });
    const bounds = new google.maps.LatLngBounds();
    routePath.forEach((p) => bounds.extend(p));
    map.fitBounds(bounds, 40);

    const km = (route.distanceMeters / 1000).toFixed(1);
    const min = Math.round(parseInt(route.duration, 10) / 60);
    $("stats").textContent = `約 ${km} km ・ 徒歩 約 ${min} 分`;
    const fmt = (p) => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
    $("openGmaps").href = "https://www.google.com/maps/dir/?api=1&travelmode=walking" +
      "&origin=" + fmt(start) + "&destination=" + fmt(start) +
      "&waypoints=" + encodeURIComponent(wps.map(fmt).join("|"));
    $("result").classList.add("show");
  }

  $("makeRoute").onclick = makeRoute;
  $("reroll").onclick = makeRoute;

  // ---------- AIお散歩 ----------
  // ルート上に等間隔で地点を置き、その先の方向を向く
  function samplePath(path, count) {
    const g = google.maps.geometry.spherical;
    const total = g.computeLength(path);
    const step = total / count;
    const out = [];
    let seg = 0, segStartDist = 0;
    for (let k = 0; k < count; k++) {
      const d = Math.min(step * k + 20, total - 1);
      while (seg < path.length - 2 && segStartDist + g.computeDistanceBetween(path[seg], path[seg + 1]) < d) {
        segStartDist += g.computeDistanceBetween(path[seg], path[seg + 1]);
        seg++;
      }
      const a = path[seg], b = path[seg + 1];
      const segLen = g.computeDistanceBetween(a, b) || 1;
      const pos = g.interpolate(a, b, Math.min(1, (d - segStartDist) / segLen));
      out.push({ pos, heading: g.computeHeading(a, b) });
    }
    return out;
  }

  async function findPano(pos) {
    try {
      const { data } = await svService.getPanorama({
        location: pos, radius: 50, source: google.maps.StreetViewSource.OUTDOOR,
      });
      return data.location;
    } catch { return null; }
  }

  async function fetchStreetImage(panoId, heading) {
    const url = "https://maps.googleapis.com/maps/api/streetview?size=640x400&fov=90&pitch=0" +
      "&pano=" + encodeURIComponent(panoId) + "&heading=" + Math.round(heading) +
      "&key=" + encodeURIComponent(apiKey);
    let res;
    try { res = await fetch(url); }
    catch { throw new Error("ストリートビュー画像を取得できませんでした。Street View Static APIが有効か確認してください。"); }
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error("ストリートビュー画像の取得に失敗（" + res.status + "）。Street View Static APIを有効にしてください。" + t.slice(0, 120));
    }
    const blob = await res.blob();
    const base64 = await new Promise((ok, ng) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1]);
      r.onerror = ng;
      r.readAsDataURL(blob);
    });
    return { blobUrl: URL.createObjectURL(blob), base64, mime: blob.type || "image/jpeg" };
  }

  const FALLBACK_MODELS = ["gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"];

  async function askGemini(stops, km, onStatus) {
    const parts = [{
      text:
`あなたは、知らない街をのんびり散歩するのが好きなAIです。
これから約${km}kmのお散歩で見た景色の写真を${stops.length}枚、歩いた順に渡します。
写真ごとに、その場で見て感じたことを一人称で1〜2文、やわらかい日本語で書いてください。
写真に写っていないものを想像で足さないでください。
季節・天気・人の気配・お店・植物・道の雰囲気など、写真から分かることに注目してください。
最後に、お散歩全体の感想を2〜3文でまとめてください。

次のJSONだけを返してください。
{"title": "お散歩のタイトル（15文字以内）", "entries": ["1枚目の感想", "2枚目の感想", ...], "summary": "全体の感想"}
entriesは写真と同じ${stops.length}個にしてください。`,
    }];
    stops.forEach((s, i) => {
      parts.push({ text: `写真${i + 1}` });
      parts.push({ inline_data: { mime_type: s.img.mime, data: s.img.base64 } });
    });

    const body = JSON.stringify({
      contents: [{ role: "user", parts }],
      generationConfig: { responseMimeType: "application/json", temperature: 0.9 },
    });
    // 混雑（503など）のときは少し待って再試行し、だめなら軽いモデルに切り替える
    const models = [geminiModel, ...FALLBACK_MODELS.filter((m) => m !== geminiModel)];
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let data, lastErr;
    outer:
    for (const model of models) {
      for (let attempt = 0; attempt < 3; attempt++) {
        onStatus?.(attempt === 0 ? `感想を書いています…（${model}）` : `混んでいるので待っています…（${model}・${attempt + 1}回目）`);
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" +
          encodeURIComponent(model) + ":generateContent", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
          body,
        });
        data = await res.json().catch(() => ({}));
        if (res.ok) break outer;
        const m = data?.error?.message || res.statusText;
        if (res.status === 400 || res.status === 403) throw new Error("Gemini APIキーを確認してください。（" + m + "）");
        if (res.status === 404) { lastErr = "モデル「" + model + "」が見つかりません"; continue outer; }
        if (res.status === 429) { lastErr = "無料枠の上限に達しました（" + model + "）"; continue outer; }
        lastErr = m;
        if (res.status >= 500) { await sleep(3000 * (attempt + 1)); continue; }
        throw new Error("Geminiの呼び出しに失敗: " + m);
      }
      data = null;
    }
    if (!data?.candidates) {
      throw new Error("Geminiが混み合っていて返事がもらえませんでした。少し時間をおいて、もう一度押してください（集めた景色はそのまま使います）。（" + lastErr + "）");
    }
    const text = data?.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "";
    try {
      const json = JSON.parse(text.replace(/^```json\s*|```$/g, "").trim());
      return {
        title: json.title || "AIのお散歩",
        entries: Array.isArray(json.entries) ? json.entries : [],
        summary: json.summary || "",
      };
    } catch {
      throw new Error("Geminiの返事をうまく読み取れませんでした。もう一度試してください。");
    }
  }

  let walk = null; // { stops, idx, timer, playing }
  let cachedStops = null; // { path, stops } 同じルートでの再試行用

  async function startAiWalk() {
    if (!routePath.length) return;
    if (!geminiKey) { openSetup("AIお散歩にはGemini APIキーが必要です。"); return; }
    stopWalk();
    const btn = $("aiWalk");
    btn.disabled = true;
    try {
      const km = google.maps.geometry.spherical.computeLength(routePath) / 1000;
      let stops;
      if (cachedStops && cachedStops.path === routePath) {
        stops = cachedStops.stops; // 前回集めた景色を使い回す
      } else {
        const count = Math.max(6, Math.min(12, Math.round(km * 4)));
        const samples = samplePath(routePath, count);
        btn.textContent = "歩く道を下見中…";
        stops = [];
        const seen = new Set();
        for (const s of samples) {
          const loc = await findPano(s.pos);
          if (!loc || seen.has(loc.pano)) continue;
          seen.add(loc.pano);
          stops.push({ ...s, pano: loc.pano, panoPos: loc.latLng });
        }
        if (stops.length < 2) throw new Error("このルートにはストリートビューがほとんどありませんでした。別のルートで試してください。");
        for (let i = 0; i < stops.length; i++) {
          btn.textContent = `景色を見ています… (${i + 1}/${stops.length})`;
          stops[i].img = await fetchStreetImage(stops[i].pano, stops[i].heading);
        }
        cachedStops = { path: routePath, stops };
      }

      const diary = await askGemini(stops, km.toFixed(1), (t) => (btn.textContent = t));
      stops.forEach((s, i) => (s.text = diary.entries[i] || "……（ここでは言葉が出てこなかったみたい）"));

      $("walkTitle").textContent = diary.title;
      $("walkSummary").textContent = diary.summary;
      $("walkSummary").classList.remove("show");
      $("walk").classList.add("show");
      walk = { stops, idx: 0, timer: null, playing: true };
      showStop(0);
      schedule();
      hideMsg();
      $("walk").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      showMsg(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "AIにお散歩してもらう";
    }
  }

  function showStop(i) {
    const s = walk.stops[i];
    walk.idx = i;
    $("walkImg").src = s.img.blobUrl;
    $("walkImg").alt = "地点" + (i + 1) + "のストリートビュー";
    $("walkText").textContent = s.text;
    $("walkCount").textContent = `${i + 1} / ${walk.stops.length} 地点目`;
    $("walkPrev").disabled = i === 0;
    $("walkNext").disabled = i === walk.stops.length - 1;
    if (i === walk.stops.length - 1) $("walkSummary").classList.add("show");
    walkerMarker.position = s.panoPos || s.pos;
    walkerMarker.map = map;
    map.panTo(s.panoPos || s.pos);
  }

  function schedule() {
    clearTimeout(walk.timer);
    $("walkPlay").textContent = walk.playing ? "一時停止" : "再生";
    if (!walk.playing) return;
    walk.timer = setTimeout(() => {
      if (walk.idx < walk.stops.length - 1) { showStop(walk.idx + 1); schedule(); }
      else { walk.playing = false; $("walkPlay").textContent = "最初から"; }
    }, 6000);
  }

  function stopWalk() {
    if (walk) clearTimeout(walk.timer);
    walk = null;
    $("walk").classList.remove("show");
    if (walkerMarker) walkerMarker.map = null;
  }

  $("aiWalk").onclick = startAiWalk;
  $("walkPrev").onclick = () => { if (!walk) return; walk.playing = false; showStop(Math.max(0, walk.idx - 1)); schedule(); };
  $("walkNext").onclick = () => { if (!walk) return; walk.playing = false; showStop(Math.min(walk.stops.length - 1, walk.idx + 1)); schedule(); };
  $("walkPlay").onclick = () => {
    if (!walk) return;
    if (!walk.playing && walk.idx === walk.stops.length - 1) showStop(0);
    walk.playing = !walk.playing;
    schedule();
  };

  // ---------- 起動 ----------
  const saved = store.get(K_MAPS);
  if (saved) { apiKey = saved; loadMaps(saved); }
  else openSetup();
})();
</script>
